<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic asset emitter playground</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">Vite plugin playground</p>
      <h1>Dynamic asset emitter</h1>
      <p id="mode"></p>
      <button id="refresh" type="button">Fetch assets again</button>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="results" aria-label="Asset results"></section>
      <p>Edit <code>examples/playground/vite.config.ts</code> to try your own asset sources.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
